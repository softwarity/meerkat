name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# One pipeline per branch: only the newest commit needs blessing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: golangci/golangci-lint-action@v9

  # Build and unit-test natively on the three OSes the binary ships for.
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  # Integration: a real gateway + the built console, driven by Playwright over
  # the seeded profiles of e2e/scenarios.json (positive AND negative access).
  e2e:
    name: Integration (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build console
        working-directory: console
        run: |
          npm ci
          npx ng build --configuration development
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run integration suite
        working-directory: e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report

  build:
    name: Cross-compile
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: console/package-lock.json
      # The console build is arch-independent: built once, embedded in every
      # binary below (same as `make ui`).
      - name: Build console
        working-directory: console
        run: |
          npm ci
          npm run build
          rm -rf ../internal/admin/ui/dist
          cp -R dist/console/browser ../internal/admin/ui/dist
      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos=${target%/*} goarch=${target#*/}
            ext=""; [ "$goos" = windows ] && ext=".exe"
            echo "building $goos/$goarch"
            GOOS=$goos GOARCH=$goarch go build -trimpath -ldflags '-s -w' \
              -o "dist/meerkat-$goos-$goarch$ext" ./cmd/meerkat
          done
      - uses: actions/upload-artifact@v7
        with:
          name: meerkat-binaries
          path: dist/*
          if-no-files-found: error

  # Publish only once everything is green. main publishes `latest` (+ `main`);
  # any other branch publishes only its own `:<branch>` tag — a throwaway image
  # to test that branch on a real cluster, never latest. Off PRs.
  image:
    name: Build & publish image
    needs: [lint, test, build]
    if: success() && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_docker.yml
