<header>
  <h2 class="mono">{{ user().username }}</h2>
  <button matIconButton (click)="closed.emit()" i18n-aria-label="@@Close" aria-label="Close">
    <mat-icon>close</mat-icon>
  </button>
</header>

<div class="body">
  @if (user().fullname || user().email) {
    <p class="identity">{{ user().fullname }} {{ user().email ? '· ' + user().email : '' }}</p>
  }

  <section>
    <h3 i18n="@@Two_factor">Two-factor</h3>
    <app-mfa-select
      [value]="user().mfaRequired"
      [inheritedLabel]="globalMfaLabel()"
      (valueChange)="setMfa($event)"
    />
  </section>

  <mat-divider />

  <section>
    <h3 i18n="@@Account">Account</h3>
    <mat-slide-toggle [checked]="user().enabled" [disabled]="isMe()" (change)="setPower('enabled', $event.checked)">
      <ng-container i18n="@@Enabled">Enabled</ng-container>
    </mat-slide-toggle>
    <div class="actions">
      <button matButton (click)="resetPassword()">
        <mat-icon>lock_reset</mat-icon>
        <ng-container i18n="@@Reset_password">Reset password</ng-container>
      </button>
      <button matButton class="danger" [disabled]="isMe()" (click)="remove()">
        <mat-icon>delete</mat-icon>
        <ng-container i18n="@@Delete">Delete</ng-container>
      </button>
    </div>
  </section>

  <mat-divider />

  <section>
    <h3 i18n="@@Sign_in_history">Sign-in history</h3>
    <app-login-history [userId]="user().id" />
  </section>
</div>
