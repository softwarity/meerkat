@if (loading()) {
  <loading-indicator withContainer />
} @else {
  <div class="banner">
    <h1 i18n="@@Section_general">General</h1>
  </div>

  <div class="content">
    <mat-card appearance="outlined" ee-feature="business-hours">
      <h3 i18n="@@Working_hours">
        Working hours
        <app-ee-lock
          feature="business-hours"
          i18n-why="@@Working_hours_ee_why"
          why="Refuse access outside declared hours, gateway-wide or per person: an audit requirement rather than a defence."
        />
      </h3>
      <p class="hint text-muted" i18n="@@Working_hours_global_hint">
        The application-wide access window: every tenant inherits it unless it defines its own.
      </p>
      <app-business-access-form
        [value]="businessAccess()"
        [topLevel]="true"
        (valueChange)="businessAccess.set($event)"
      />
    </mat-card>

    <div class="flex justify-end">
      <button matButton="filled" (click)="save()" [disabled]="saving()" i18n="@@Save">Save</button>
    </div>
  </div>
}
