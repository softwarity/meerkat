@if (state() === 'reference') {
  <!-- What matters here is WHICH entry, so the name is shown rather than the
       ${...} syntax. There is nothing to reveal: the value is not in this page. -->
  <app-form-field
    [label]="label()"
    icon="lock"
    [hint]="hint()"
    allowVault="secret"
    vaultReplace
    [vaultScope]="scope()"
  >
    <textarea
      matInput
      rows="1"
      class="oneline"
      readonly
      spellcheck="false"
      [value]="entry()"
      (input)="value.set($any($event.target).value)"
      (keydown.enter)="$event.preventDefault()"
    ></textarea>
  </app-form-field>
} @else {
  <app-form-field
    [label]="label()"
    [hint]="hint()"
    masked
    revealable
    allowVault="secret"
    vaultReplace
    [vaultScope]="scope()"
  >
    <!-- A one-line textarea, not an input: browsers never offer credential
         autofill on a textarea, and never offer to remember what is typed. -->
    <textarea
      matInput
      rows="1"
      class="oneline"
      spellcheck="false"
      autocapitalize="off"
      autocorrect="off"
      [value]="value()"
      [placeholder]="state() === 'held' ? '••••••••' : placeholder()"
      (input)="value.set($any($event.target).value)"
      (keydown.enter)="$event.preventDefault()"
    ></textarea>
  </app-form-field>
}

@if (issue(); as i) {
  <!-- The way out sits IN the message: a blocking field whose fix is somewhere
       else on the screen is a dead end. -->
  <p class="issue flex items-center gap-2" [class.text-error]="i.blocking" [class.text-muted]="!i.blocking">
    <mat-icon>{{ i.blocking ? 'error' : 'info' }}</mat-icon>
    <span class="flex-1">{{ i.text }}</span>
    @if (i.canMove) {
      <button matButton type="button" (click)="move()">
        <mat-icon>move_to_inbox</mat-icon>
        <span i18n="@@Move_into_the_vault">Move into the vault</span>
      </button>
    }
  </p>
}
