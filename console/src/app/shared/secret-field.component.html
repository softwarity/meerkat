@if (state() === 'reference') {
  <!-- What matters here is WHICH entry, so the name is shown rather than the
       ${...} syntax. There is nothing to reveal: the value is not in this page. -->
  <app-form-field
    [label]="label()"
    icon="lock"
    [hint]="hint()"
    allowVault="secret"
    vaultReplace
    [vaultScope]="scope()"
  >
    <textarea
      matInput
      rows="1"
      class="oneline"
      readonly
      spellcheck="false"
      [value]="entry()"
      (input)="value.set($any($event.target).value)"
      (keydown.enter)="$event.preventDefault()"
    ></textarea>
  </app-form-field>
} @else {
  <!-- The message and its way out both belong to the field: the text sits in
       the subscript like any error, the action in the suffix row like any
       other tool the field carries. -->
  <app-form-field
    [label]="label()"
    [hint]="issue()?.blocking ? '' : (issue()?.text ?? hint())"
    [error]="issue()?.blocking ? issue()!.text : ''"
    [actionIcon]="issue()?.canMove ? 'enhanced_encryption' : ''"
    [actionLabel]="moveLabel"
    (action)="move()"
    masked
    revealable
    allowVault="secret"
    vaultReplace
    [vaultScope]="scope()"
  >
    <!-- A one-line textarea, not an input: browsers never offer credential
         autofill on a textarea, and never offer to remember what is typed. -->
    <textarea
      matInput
      rows="1"
      class="oneline"
      spellcheck="false"
      autocapitalize="off"
      autocorrect="off"
      [value]="value()"
      [placeholder]="state() === 'held' ? '••••••••' : placeholder()"
      (input)="value.set($any($event.target).value)"
      (keydown.enter)="$event.preventDefault()"
    ></textarea>
  </app-form-field>
}
